<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        width: 400px;
        height: 400px;
        border: 2px solid black;
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: green;
        color: #f6d8bd;
        border-radius: 16px;
      }
      label,
      input,
      button {
        font-size: 1.5rem;
        margin: 10px;
      }
      button {
        background-color: brown;
        color: #faf7bb;
        margin-left: 125px;
      }
      h1{
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Sum of four numbers</h1>
    <div class="container">
      <div class="sub-container">
        <label for="">Enter your 1st number: </label><br />
        <input type="text" id="n1" /><br />
        <label for="">Enter your 2nd number: </label><br />
        <input type="text" id="n2" /><br />
        <label for="">Enter your 3rd number: </label><br />
        <input type="text" id="n3" /><br />
        <label for="">Enter your 4th number: </label><br />
        <input type="text" id="n4" /><br />
        <button onclick="sum()">Sum</button>
      </div>
    </div>

    <script type="text/javascript" src="script.js"></script>
  </body>
</html>
